<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="robots" content="noindex">
  <title>Tot | Em breve</title>
  <link rel="icon" type="image/png" href="../img/favicon.png?v=4">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f7f6f2;
      --bg-soft: #edeae2;
      --surface: #ffffff;
      --line: rgba(23,22,18,.15);
      --line-blue: rgba(23,22,18,.32);
      --text: #1b1a17;
      --muted: #6b6a62;
      --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding: 40px 20px;
    }
    .wrap { width: min(560px, 100%); text-align: center; }
    .back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 44px; color: var(--muted); font-size: .82rem; font-weight: 600; text-decoration: none; }
    .back:hover { color: var(--text); }
    .logo { width: 200px; margin: 0 auto 36px; display: block; }
    .eyebrow { display: inline-flex; align-items: center; padding-left: 12px; border-left: 2px solid var(--text); margin-bottom: 20px; color: var(--muted); font-size: .74rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
    h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.2; letter-spacing: -.01em; }
    h1 em { font-style: italic; color: var(--muted); font-weight: 500; }
    p.copy { margin-top: 18px; color: var(--muted); font-size: 1.02rem; max-width: 460px; margin-inline: auto; }
    .countdown { display: flex; justify-content: center; gap: 14px; margin: 44px 0 8px; flex-wrap: wrap; }
    .countdown div { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 76px; padding: 18px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .countdown strong { font-family: var(--serif); font-size: 2rem; letter-spacing: -.02em; }
    .countdown span { color: var(--muted); font-size: .66rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .eta { margin-top: 20px; color: var(--muted); font-size: .82rem; }
    .actions { margin-top: 40px; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 48px; padding: 0 24px; border: 1px solid var(--text); border-radius: 6px; text-decoration: none; font-size: .8rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text); background: transparent; transition: color .2s, background .2s; }
    .btn:hover { color: #fff; background: var(--text); }
    .btn-whatsapp { color: #fff; background: #25d366; border-color: #25d366; }
    .btn-whatsapp:hover { color: #25d366; background: transparent; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="../img/logo-tot.png" alt="Tot">
    <span class="eyebrow">Em construção</span>
    <h1>Treinando a IA pra não te deixar <em>esperando.</em></h1>
    <p class="copy">O Tot está sendo desenvolvido com todo carinho. Assim que ficar pronto, você vai ser um dos primeiros a saber.</p>
    <div class="countdown" id="countdown">
      <div><strong id="cd-days">00</strong><span>Dias</span></div>
      <div><strong id="cd-hours">00</strong><span>Horas</span></div>
      <div><strong id="cd-minutes">00</strong><span>Min</span></div>
      <div><strong id="cd-seconds">00</strong><span>Seg</span></div>
    </div>
    <p class="eta">Previsão de lançamento: fevereiro de 2027</p>
    <div class="actions">
      <a class="btn btn-whatsapp" href="https://wa.me/5521970656726?text=Ol%C3%A1%2C%20quero%20ser%20avisado%20quando%20o%20Tot%20lan%C3%A7ar." target="_blank" rel="noopener">Quero ser avisado</a>
      <a class="btn" href="../">Voltar ao início</a>
    </div>
  </div>

  <script>
    const target = new Date('2027-02-11T00:00:00-03:00').getTime();
    function tick() {
      const now = Date.now();
      const diff = Math.max(0, target - now);
      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const minutes = Math.floor((diff % 3600000) / 60000);
      const seconds = Math.floor((diff % 60000) / 1000);
      document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
      document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('cd-minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('cd-seconds').textContent = String(seconds).padStart(2, '0');
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
